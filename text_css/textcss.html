<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .h1{
            text-decoration: underline;
            text-align: center;
        }

        .h2{
            text-decoration: overline;
            text-align: right;
        }
        .h3{
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <h1 class = h1 >This is text gaming.</h1>
    <h2 class = h2 >This is text gaming.</h2>
    <h3 class = h3 >This is text gaming.</h3>
    <h4 class = h4 >This is text gaming.</h4>
    <h4 class = h5 >This is text gaming.</h4>
</body>
</html>
